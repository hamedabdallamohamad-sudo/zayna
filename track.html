<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1F2A44">
    <title>تتبع الطلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-stone-50 text-stone-800 antialiased min-h-screen">
<header class="bg-stone-900 text-white">
    <div class="max-w-xl mx-auto px-4 h-16 flex items-center gap-3">
        <img id="logo" alt="" class="hidden w-10 h-10 rounded-full object-cover ring-2 ring-amber-500/40">
        <div id="logoMark" class="w-10 h-10 rounded-full bg-stone-800 text-amber-400 font-bold text-xl flex items-center justify-center ring-2 ring-amber-500/20">Z</div>
        <span id="storeName" class="font-extrabold text-lg">زينة</span>
    </div>
</header>
<main class="max-w-xl mx-auto px-4 py-8">
    <div id="view" class="text-center text-stone-400 py-20"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>
</main>
<script type="module" src="js/track.js"></script>
</body>
</html>
