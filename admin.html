<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>لوحة التحكم | زينة</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" content="Zayna Store">
    <meta name="theme-color" content="#1F2A44">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Tailwind (سيُستبدل لاحقاً ببناء محلي) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] },
                    colors: {
                        rose: { 50:'#fff1f2',100:'#ffe4e6',600:'#e11d48',700:'#be123c',800:'#9f1239',900:'#881337' },
                        gold: '#D4AF37',
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-stone-50 text-stone-800 antialiased min-h-screen flex flex-col" data-page="admin">

<!-- ===== ADMIN VIEW ===== -->
<div id="adminView" class="hidden max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full flex-grow">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 gap-4 bg-stone-900 text-white p-6 rounded-2xl shadow-xl">
        <div>
            <h2 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-sliders text-amber-400"></i> لوحة إدارة متجر زينة
            </h2>
            <p class="text-stone-400 text-sm mt-1">إدارة المنتجات، القطع والطلبات بسهولة</p>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="openProductFormModal()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2 shadow-md">
                <i class="fa-solid fa-plus"></i> إضافة قطعة جديدة
            </button>
            <button onclick="location.href='index.html'" class="bg-stone-800 hover:bg-stone-700 text-stone-300 px-4 py-2.5 rounded-xl font-bold text-sm transition border border-stone-700">العودة للمتجر</button>
            <button onclick="adminLogout()" class="bg-stone-800 hover:bg-red-900 text-stone-300 px-4 py-2.5 rounded-xl font-bold text-sm transition border border-stone-700">تسجيل الخروج</button>
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-10">
        <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm flex items-center justify-between">
            <div>
                <p class="text-sm font-medium text-stone-500">إجمالي القطع</p>
                <h3 id="statTotalProducts" class="text-3xl font-extrabold text-stone-900 mt-1">0</h3>
            </div>
            <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-700 flex items-center justify-center text-xl"><i class="fa-solid fa-gem"></i></div>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm flex items-center justify-between">
            <div>
                <p class="text-sm font-medium text-stone-500">عدد الطلبات</p>
                <h3 id="statTotalOrders" class="text-3xl font-extrabold text-stone-900 mt-1">0</h3>
            </div>
            <div class="w-12 h-12 rounded-xl bg-green-50 text-green-700 flex items-center justify-center text-xl"><i class="fa-solid fa-box-archive"></i></div>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm flex items-center justify-between">
            <div>
                <p class="text-sm font-medium text-stone-500">المبيعات الإجمالية</p>
                <h3 id="statTotalSales" class="text-3xl font-extrabold text-stone-900 mt-1">0 ج.س</h3>
            </div>
            <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl"><i class="fa-solid fa-coins"></i></div>
        </div>
    </div>

    <div class="flex border-b border-stone-200 mb-6 gap-6">
        <button onclick="switchAdminTab('products')" id="tabBtnProducts" class="pb-3 text-sm font-bold border-b-2 border-rose-600 text-rose-800">إدارة المنتجات</button>
        <button onclick="switchAdminTab('orders')" id="tabBtnOrders" class="pb-3 text-sm font-bold border-b-2 border-transparent text-stone-500 hover:text-stone-800">قائمة الطلبات</button>
    </div>

    <div id="adminProductsTab" class="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-right border-collapse">
                <thead>
                <tr class="bg-stone-100 text-stone-600 text-xs font-bold uppercase border-b border-stone-200">
                    <th class="p-4">اسم القطعة</th>
                    <th class="p-4">الفئة</th>
                    <th class="p-4">السعر</th>
                    <th class="p-4">التقييم</th>
                    <th class="p-4 text-center">الإجراءات</th>
                </tr>
                </thead>
                <tbody id="adminProductsTable" class="divide-y divide-stone-100 text-sm"></tbody>
            </table>
        </div>
    </div>

    <div id="adminOrdersTab" class="hidden bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-right border-collapse">
                <thead>
                <tr class="bg-stone-100 text-stone-600 text-xs font-bold uppercase border-b border-stone-200">
                    <th class="p-4">رقم الطلب</th>
                    <th class="p-4">المكونات</th>
                    <th class="p-4">المجموع</th>
                    <th class="p-4">التاريخ</th>
                </tr>
                </thead>
                <tbody id="adminOrdersTable" class="divide-y divide-stone-100 text-sm"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- ===== ADMIN AUTH MODAL ===== -->
<div id="adminAuthModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm flex">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl relative text-center">
        <div class="w-12 h-12 bg-rose-100 text-rose-800 rounded-full flex items-center justify-center mx-auto mb-3 text-xl"><i class="fa-solid fa-lock"></i></div>
        <h3 class="text-xl font-bold text-stone-900 mb-1">دخول مدير المتجر</h3>
        <p class="text-xs text-stone-500 mb-4">دخول المدير فقط</p>
        <input type="email" id="adminEmailInput" placeholder="البريد الإلكتروني" autocomplete="username" dir="ltr"
               class="w-full px-4 py-2.5 border rounded-xl mb-3 text-center text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
        <input type="password" id="adminPasswordInput" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr" onkeydown="if(event.key==='Enter')adminLogin()"
               class="w-full px-4 py-2.5 border rounded-xl mb-4 text-center text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
        <button onclick="adminLogin()" class="w-full bg-stone-900 hover:bg-rose-800 text-white font-bold py-2.5 rounded-xl transition text-sm">تسجيل الدخول</button>
    </div>
</div>

<!-- ===== PRODUCT FORM MODAL ===== -->
<div id="productFormModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm flex">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <button onclick="closeProductFormModal()" class="absolute top-4 left-4 text-stone-400 hover:text-stone-600"><i class="fa-solid fa-xmark"></i></button>
        <h3 id="formModalTitle" class="text-xl font-bold text-stone-900 mb-4">إضافة قطعة جديدة</h3>
        <form id="productForm" onsubmit="handleSaveProduct(event)" class="space-y-4">
            <input type="hidden" id="editProductId">
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">اسم القطعة</label>
                <input type="text" id="formName" required class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1">الفئة</label>
                    <select id="formCategory" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
                        <option value="jewelry">سلاسل ومجوهرات</option>
                        <option value="rings">أقراط وخواتم</option>
                        <option value="watches">ساعات أنيقة</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1">السعر (ج.س)</label>
                    <input type="number" id="formPrice" required min="0" step="0.01" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">رابط صورة المنتج (URL)</label>
                <input type="url" id="formImage" required class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none" placeholder="https://...">
            </div>
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">تفاصيل الخامة / المواد</label>
                <input type="text" id="formNotes" required class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none" placeholder="مطلي بالذهب 18، زركون، لؤلؤ...">
            </div>
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">الوصف</label>
                <textarea id="formDescription" rows="3" required class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition text-sm shadow-md mt-2">حفظ القطعة</button>
        </form>
    </div>
</div>


<script type="module" src="js/app.js"></script>
</body>
</html>
